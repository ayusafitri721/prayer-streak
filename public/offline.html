<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Prayer Streak</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(160deg, #f6f1e9 0%, #f2ebdf 45%, #eef4ec 100%);
        color: #344e41;
        padding: 24px;
      }
      .card {
        width: min(100%, 540px);
        border-radius: 28px;
        border: 1px solid rgba(163, 177, 138, 0.5);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 50px rgba(52, 78, 65, 0.12);
        padding: 28px;
        text-align: center;
      }
      .logo {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        margin: 0 auto 14px auto;
        background: rgba(88, 129, 87, 0.12);
        border: 1px solid rgba(88, 129, 87, 0.2);
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      p {
        margin: 10px 0 0 0;
        line-height: 1.6;
        color: rgba(52, 78, 65, 0.85);
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a,
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.92rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: #588157;
        color: #fff;
      }
      .secondary {
        background: #f6f1e9;
        color: #344e41;
        border: 1px solid rgba(163, 177, 138, 0.45);
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="logo">
        <img src="/assets/prayer-streak-logo.svg" alt="Prayer Streak" width="28" height="28" />
      </div>
      <h1>Kamu Lagi Offline</h1>
      <p>Halaman yang kamu buka belum ada di cache. Cek koneksi internet lalu coba lagi.</p>
      <div class="actions">
        <button class="primary" onclick="window.location.reload()">Coba Lagi</button>
        <a class="secondary" href="/dashboard">Ke Dashboard</a>
      </div>
    </article>
  </body>
</html>
